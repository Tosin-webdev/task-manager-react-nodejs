# Tables are currently created manually.
# Application VMs fetch database secrets at startup.

steps:
  - name: "node:20"
    id: "install-client"
    dir: "client"
    entrypoint: "npm"
    args: ["ci"]
    waitFor: ["-"]

  - name: "node:20"
    id: "install-server"
    dir: "server"
    entrypoint: "npm"
    args: ["ci"]
    waitFor: ["-"]

  # Stop deployment if automated migrations have been introduced.
  - name: "node:20"
    id: "check-migration-policy"
    dir: "server"
    entrypoint: "node"
    args:
      - "-e"
      - |
        const pkg = require('./package.json');
        if (pkg.scripts && pkg.scripts.migrate) {
          console.error('Configure database migrations before deploying.');
          process.exit(1);
        }
        console.log('Manual-schema setup: no migrate script configured.');
    waitFor: ["install-server"]

  - name: "node:20"
    id: "test-server"
    dir: "server"
    entrypoint: "npm"
    args: ["test"]
    env:
      - "CI=true"
    waitFor: ["check-migration-policy"]

  - name: "node:20"
    id: "build-client"
    dir: "client"
    entrypoint: "npm"
    args: ["run", "build"]
    env:
      - "CI=true"
      - "REACT_APP_API_URL=/api"
    waitFor: ["install-client", "test-server"]

  # Package the React build, server code, and runtime configuration.
  - name: "ubuntu:24.04"
    id: "package-app"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        test -f scripts/startup.sh

        tar -czf app-$COMMIT_SHA-$BUILD_ID.tar.gz \
          client/build \
          server/src \
          server/package.json \
          server/package-lock.json \
          server/ecosystem.config.js \
          nginx/default.conf

        ls -lh app-$COMMIT_SHA-$BUILD_ID.tar.gz
    waitFor: ["build-client"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "upload-artifact"
    args:
      - "storage"
      - "cp"
      - "app-$COMMIT_SHA-$BUILD_ID.tar.gz"
      - "gs://$PROJECT_ID-app-releases/releases/app-$COMMIT_SHA-$BUILD_ID.tar.gz"
    waitFor: ["package-app"]

  # Each build creates a uniquely named instance template.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "create-instance-template"
    args:
      - "compute"
      - "instance-templates"
      - "create"
      - "prod-app-template-$BUILD_ID"
      - "--project=$PROJECT_ID"
      - "--machine-type=e2-standard-2"
      - "--image-family=ubuntu-2204-lts"
      - "--image-project=ubuntu-os-cloud"
      - "--boot-disk-size=20GB"
      - "--boot-disk-type=pd-ssd"
      - "--network=prod-vpc"
      - "--subnet=app-subnet"
      - "--region=us-central1"
      - "--no-address"
      - "--service-account=app-vm-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--scopes=cloud-platform"
      - "--metadata=APP_VERSION=$COMMIT_SHA-$BUILD_ID"
      - "--metadata-from-file=startup-script=scripts/startup.sh"
      - "--tags=app-server"
      - "--description=Deployed from commit $COMMIT_SHA on build $BUILD_ID"
    waitFor: ["upload-artifact"]

  # Allow up to three extra VMs during the regional rolling update.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "rolling-update"
    args:
      - "compute"
      - "instance-groups"
      - "managed"
      - "rolling-action"
      - "start-update"
      - "prod-app-mig"
      - "--project=$PROJECT_ID"
      - "--region=us-central1"
      - "--version=template=prod-app-template-$BUILD_ID"
      - "--max-surge=3"
      - "--max-unavailable=0"
      - "--replacement-method=substitute"
    waitFor: ["create-instance-template"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "wait-for-version"
    args:
      - "compute"
      - "instance-groups"
      - "managed"
      - "wait-until"
      - "prod-app-mig"
      - "--project=$PROJECT_ID"
      - "--region=us-central1"
      - "--version-target-reached"
      - "--timeout=1200"
    waitFor: ["rolling-update"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-https"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        curl \
          --fail \
          --show-error \
          --silent \
          --connect-timeout 10 \
          --max-time 30 \
          --retry 10 \
          --retry-delay 5 \
          --retry-all-errors \
          https://app.tcodes.dev/health
    waitFor: ["wait-for-version"]

logsBucket: "gs://$PROJECT_ID-cloudbuild-logs"

options:
  logging: GCS_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "2400s"
