        console.log('Manual-schema setup: no migrate script configured.');
    waitFor: ["install-server"]

  - name: "node:20"
    id: "test-server"
    dir: "server"
    entrypoint: "npm"
    args: ["test"]
    env: ["CI=true"]
    waitFor: ["check-migration-policy"]

  - name: "node:20"
    id: "build-client"
    dir: "client"
    entrypoint: "npm"
    args: ["run", "build"]
    env:
      - "CI=true"
      - "REACT_APP_API_URL=/api"
    waitFor: ["install-client", "test-server"]

  - name: "ubuntu:24.04"
    id: "package-app"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        test -f scripts/startup.sh
        tar -czf app-$COMMIT_SHA-$BUILD_ID.tar.gz \
          client/build \
          server/src \
          server/package.json \
          server/package-lock.json \
          server/ecosystem.config.js \
          nginx/default.conf
        ls -lh app-$COMMIT_SHA-$BUILD_ID.tar.gz
    waitFor: ["build-client"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "upload-artifact"
    args:
      - "storage"
      - "cp"
      - "app-$COMMIT_SHA-$BUILD_ID.tar.gz"
      - "gs://$PROJECT_ID-app-releases/releases/app-$COMMIT_SHA-$BUILD_ID.tar.gz"
    waitFor: ["package-app"]

  # BUILD_ID makes template names unique even when retrying the same commit.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "create-instance-template"
    args:
      - "compute"
      - "instance-templates"
      - "create"
      - "prod-app-template-$BUILD_ID"
      - "--project=$PROJECT_ID"
      - "--machine-type=e2-standard-2"
      - "--image-family=ubuntu-2204-lts"
      - "--image-project=ubuntu-os-cloud"
      - "--boot-disk-size=20GB"
      - "--boot-disk-type=pd-ssd"
      - "--network=prod-vpc"
      - "--subnet=app-subnet"
      - "--region=us-central1"
      - "--no-address"
      - "--service-account=app-vm-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--scopes=cloud-platform"
      - "--metadata=APP_VERSION=$COMMIT_SHA-$BUILD_ID"
      - "--metadata-from-file=startup-script=scripts/startup.sh"
      - "--tags=app-server"
      - "--description=Commit $COMMIT_SHA; build $BUILD_ID"
    waitFor: ["upload-artifact"]

  # Appropriate for a regional MIG spanning up to three zones.
  # Configure application health checks/readiness separately.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "rolling-update"
    args:
      - "compute"
      - "instance-groups"
      - "managed"
      - "rolling-action"
      - "start-update"
      - "prod-app-mig"
      - "--project=$PROJECT_ID"
      - "--region=us-central1"
      - "--version=template=prod-app-template-$BUILD_ID"
      - "--max-surge=3"
      - "--max-unavailable=0"
      - "--replacement-method=substitute"
    waitFor: ["create-instance-template"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "wait-for-version"
    args:
      - "compute"
      - "instance-groups"
      - "managed"
      - "wait-until"
      - "prod-app-mig"
      - "--project=$PROJECT_ID"
      - "--region=us-central1"
      - "--version-target-reached"
      - "--timeout=1200"
    waitFor: ["rolling-update"]

  # Check the public health endpoint after the target version is reached.
  # This checks availability, not which commit answered the request.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-https"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        curl --fail --show-error --silent \
          --connect-timeout 10 --max-time 30 \
          --retry 10 --retry-delay 5 --retry-all-errors \
          https://app.tcodes.dev/health
    waitFor: ["wait-for-version"]

logsBucket: "gs://$PROJECT_ID-cloudbuild-logs"

options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
