# Save at the repository root as cloudbuild.yaml.
# Database tables are currently created manually.
# Application VMs fetch database secrets at startup.

steps:
  - name: "node:20"
    id: "install-client"
    dir: "client"
    entrypoint: "npm"
    args: ["ci"]
    waitFor: ["-"]

  - name: "node:20"
    id: "install-server"
    dir: "server"
    entrypoint: "npm"
    args: ["ci"]
    waitFor: ["-"]

  # Stop if migrations are introduced without configuring their execution.
  - name: "node:20"
    id: "check-migration-policy"
    dir: "server"
    entrypoint: "node"
    args:
      - "-e"
      - |
        const pkg = require('./package.json');
        if (pkg.scripts && pkg.scripts.migrate) {
          console.error('Configure database migrations before deploying.');
          process.exit(1);
        }
        console.log('Manual-schema setup: no migrate script configured.');
    waitFor: ["install-server"]

  - name: "node:20"
    id: "test-server"
    dir: "server"
    entrypoint: "npm"
    args: ["test"]
    env:
      - "CI=true"
    waitFor: ["check-migration-policy"]

  - name: "node:20"
    id: "build-client"
    dir: "client"
    entrypoint: "npm"
    args: ["run", "build"]
    env:
      - "CI=true"
      - "REACT_APP_API_URL=/api"
    waitFor: ["install-client", "test-server"]

  # Package the application files needed by the VMs.
  - name: "ubuntu:24.04"
    id: "package-app"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        test -f scripts/startup.sh

        tar -czf app-$COMMIT_SHA-$BUILD_ID.tar.gz \
          client/build \
          server/src \
          server/package.json \
          server/package-lock.json \
          server/ecosystem.config.js \
          nginx/default.conf

        ls -lh app-$COMMIT_SHA-$BUILD_ID.tar.gz
    waitFor: ["build-client"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "upload-artifact"
    args:
      - "storage"
      - "cp"
      - "app-$COMMIT_SHA-$BUILD_ID.tar.gz"
      - "gs://$PROJECT_ID-app-releases/releases/app-$COMMIT_SHA-$BUILD_ID.tar.gz"
    waitFor: ["package-app"]

  # A unique template name allows retries of the same commit.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "create-instance-template"
    args:
      - "compute"
      - "instance-templates"
      - "create"
      - "prod-app-template-$BUILD_ID"
      - "--project=$PROJECT_ID"
      - "--machine-type=e2-standard-2"
      - "--image-family=ubuntu-2204-lts"
      - "--image-project=ubuntu-os-cloud"
      - "--boot-disk-size=20GB"
      - "--boot-disk-type=pd-ssd"
      - "--network=prod-vpc"
      - "--subnet=app-subnet"
      - "--region=us-central1"
      - "--no-address"
      - "--service-account=app-vm-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--scopes=cloud-platform"
      - "--metadata=APP_VERSION=$COMMIT_SHA-$BUILD_ID"
      - "--metadata-from-file=startup-script=scripts/startup.sh"
      - "--tags=app-server"
      - "--description=Deployed from commit $COMMIT_SHA on build $BUILD_ID"
    waitFor: ["upload-artifact"]

  # Allow up to three extra VMs during the regional rolling update.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "rolling-update"
    args:
      - "compute"
      - "instance-groups"
      - "managed"
      - "rolling-action"
      - "start-update"
      - "prod-app-mig"
      - "--project=$PROJECT_ID"
      - "--region=us-central1"
      - "--version=template=prod-app-template-$BUILD_ID"
      - "--max-surge=3"
      - "--max-unavailable=0"
      - "--replacement-method=substitute"
    waitFor: ["create-instance-template"]

  # Wait for the VMs to reach the requested template version.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "wait-for-version"
    args:
      - "compute"
      - "instance-groups"
      - "managed"
      - "wait-until"
      - "prod-app-mig"
      - "--project=$PROJECT_ID"
      - "--region=us-central1"
      - "--version-target-reached"
      - "--timeout=1200"
    waitFor: ["rolling-update"]

  # VM rollout completion does not guarantee application readiness.
  # Check HTTPS up to 18 times and stop immediately on HTTP 200.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-https"
    entrypoint: "bash"
    timeout: "400s"
    args:
      - "-c"
      - |
        set -euo pipefail

        for attempt in {1..18}; do
          status=$$(curl \
            --silent \
            --show-error \
            --output /tmp/health-response \
            --write-out '%{http_code}' \
            --connect-timeout 5 \
            --max-time 10 \
            https://app.tcodes.dev/health) || status="000"

          if [ "$$status" = "200" ]; then
            echo "Application is ready. HTTPS health check passed."
            exit 0
          fi

          echo "Attempt $$attempt/18: HTTP $$status."

          if [ "$$attempt" -lt 18 ]; then
            echo "Retrying in 10 seconds."
            sleep 10
          fi
        done

        echo "Application did not become ready within the allowed time."
        exit 1
    waitFor: ["wait-for-version"]

logsBucket: "gs://$PROJECT_ID-cloudbuild-logs"

options:
  logging: GCS_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "2400s"
